<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YOZZ</title>
    <!-- The wordmark reduced to its one distinctive letter. SVG only, deliberately: every browser
         this SPA targets supports it, and a .ico would freeze the mark at two raster sizes. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Zero-knowledge webmail for the email accounts you already own. YOZZ's servers cannot read your mail or credentials; your existing mail provider remains unchanged."
    />
    <meta property="og:title" content="YOZZ — Zero-knowledge webmail" />
    <meta
      property="og:description"
      content="Your browser does the mail. YOZZ's servers cannot read your mail or credentials; your existing mail provider remains unchanged."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yozz.app/" />
    <!-- Rendered from assets/og-card.html; that file carries the render command and the reasons
         for its layout. Absolute URL because a crawler resolves og:image against nothing, and the
         declared dimensions because several platforms lay out the unfurl before the bytes land. -->
    <meta property="og:image" content="https://yozz.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="An opened envelope with a YOZZ inbox sliding out of it, over the wordmark and the words: Zero-knowledge webmail, for the email accounts you already own."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="YOZZ — Zero-knowledge webmail" />
    <meta
      name="twitter:description"
      content="Your browser does the mail. YOZZ's servers cannot read your mail or credentials; your existing mail provider remains unchanged."
    />
    <!-- YOZZ ships one surface: dark. There is deliberately no system-scheme detection and no
         stored preference here — see src/styles/global.css. `color-scheme` is declared up front so
         the UA paints form controls and the scrollbar dark from the first frame. -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#151311" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
