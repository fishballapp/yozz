name: CI

# Every gate, on every branch. The private monorepo this tree is ejected from pushes each of its
# pull requests to a branch of the same name here, so these run before the private merge; cd.yml
# calls this workflow again on main before it deploys. GitHub-hosted runners cost nothing on a
# public repo, so no suite is skipped by path and each one is its own job.
on:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer snapshot of a branch supersedes the one under test; main queues behind cd.yml's deploy.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm repojj:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Received mail's containment in all three browser engines. Outside vitest because CSP and
  # sandbox behaviour belong to real browsers.
  html:
    name: HTML containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # html:security checks the emitted document as well as the real sanitizer module: a Vite
      # change that adds an inline script must fail before the host CSP blanks production.
      - run: pnpm -F @yozz.app/web build
      - id: playwright-version
        run: echo "version=$(pnpm -F @yozz.app/web exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm -F @yozz.app/web exec playwright install chromium firefox webkit
      - run: pnpm -F @yozz.app/web exec playwright install-deps chromium firefox webkit
      - run: pnpm -F @yozz.app/web html:security

  # x509-limbo's 9739 path-validation testcases: a 39MB corpus, too big for vitest. Two
  # authentication bypasses shipped while this was a command someone had to remember.
  limbo:
    name: x509-limbo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Keyed on the pin, not a date: the same key is the same corpus, and a pin bump is a new key.
      - uses: actions/cache@v4
        with:
          path: packages/x509/.limbo
          key: limbo-${{ hashFiles('packages/x509/harness/pin.ts') }}
      - run: pnpm -F @yozz.app/x509 limbo:fetch
      # Non-zero when the disagreement set differs from expected-disagreements.txt in EITHER
      # direction: a new over-accept and a silently fixed one both stop the build.
      - run: pnpm -F @yozz.app/x509 limbo:ours

  # BoringSSL's TLS conformance runner. It ships inside BoringSSL, so it is Go and moves with the
  # library; the revision under test is pinned in packages/tls/harness/bogo/pin.ts.
  bogo:
    name: BoGo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          # BoringSSL's go.sum only arrives with the pinned checkout, so there is nothing to key a
          # module cache on, and the four modules the runner needs download in seconds.
          cache: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: packages/tls/.bogo
          key: bogo-${{ hashFiles('packages/tls/harness/bogo/pin.ts') }}
      - run: pnpm -F @yozz.app/tls bogo:fetch
      # Fails when any in-scope test moves from what expected.txt records: a regression and a fix
      # both land there, and both want a look. A test that moves on one run and not the next is
      # timing between the runner and the shim; the levers are the runner's own -num-workers and
      # -idle-timeout flags (passed from harness/bogo/run.ts, which sets neither today), not a retry.
      - run: pnpm -F @yozz.app/tls bogo
