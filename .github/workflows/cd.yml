name: Publish

# Every push to main publishes whatever library versions npm does not have yet: bump the four
# packages in lockstep, eject, and the release follows. No token: npm trusted publishing over the
# workflow's OIDC identity, configured per package on npmjs.com. The apps are private and never
# publish.
on:
  push:
    branches:
      - main

# Two releases pushed close together must not race `pnpm -r publish`'s read-then-write.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # GitHub-hosted on purpose: npm trusted publishing (the OIDC exchange below) does not work on
    # self-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # An npm version is permanent, so the publish job runs every gate itself rather than
      # trusting ci.yml, which runs in parallel and cannot hold this one back.
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      # Each package builds itself in `prepack`; this is only so a build failure reads as one.
      - run: pnpm -r --filter './packages/*' build
      - id: version
        # The four libraries release in lockstep; the dist-tag comes from that one version, so a
        # drift between them is a failed release, not a prerelease published as `latest`.
        run: |
          VERSIONS=$(node -p "['x509','tls','imap','smtp'].map(p => require('./packages/' + p + '/package.json').version).join(' ')")
          if [ "$(echo "$VERSIONS" | tr ' ' '\n' | sort -u | wc -l)" -ne 1 ]; then
            echo "library versions differ: $VERSIONS" >&2; exit 1
          fi
          VERSION=${VERSIONS%% *}
          TAG=$(echo "$VERSION" | grep -oE 'alpha|beta|rc' || true)
          echo "tag=${TAG:-latest}" >> "$GITHUB_OUTPUT"
      - run: pnpm -r publish --tag ${{ steps.version.outputs.tag }}
