name: CD

# Every push to main runs every gate (ci.yml), then deploys yozz.app and publishes whatever library
# versions npm does not have yet: the four libraries in lockstep and, on its own version, the CLI.
# This is the only path to production, so what is live is always a commit on this branch.
#
# Keep this filename: npm trusted publishing validates it for all five packages.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    name: Gates
    uses: ./.github/workflows/ci.yml

  # D1 migrations, then the API Worker, then the web host. Each step resolves its Cloudflare deploy
  # token (and the API's runtime secrets) from 1Password through varlock and YOZZ_OP_TOKEN, a
  # secret of the `production` environment, which only main can deploy to.
  deploy:
    name: Deploy yozz.app
    needs: gates
    runs-on: ubuntu-latest
    environment: production
    # A hung wrangler or 1Password call would otherwise hold the deploy group for the 360m default.
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Before the Worker, so it never ships ahead of its schema. Needs the deploy token's D1: Edit.
      - name: Apply D1 migrations
        run: pnpm -F @yozz.app/worker-api db:migrate:remote
        env:
          OP_TOKEN: ${{ secrets.YOZZ_OP_TOKEN }}
      - name: Deploy the API Worker
        run: pnpm -F @yozz.app/worker-api run deploy
        env:
          OP_TOKEN: ${{ secrets.YOZZ_OP_TOKEN }}
      # Builds apps/web with VITE_API_URL=https://api.yozz.app, then deploys the assets-only host.
      # Its varlock schema loads the deploy token alone, so no runtime secret reaches this step.
      - name: Deploy the web host
        run: pnpm -F @yozz.app/worker-web run deploy
        env:
          OP_TOKEN: ${{ secrets.YOZZ_OP_TOKEN }}

  # No token: npm trusted publishing over the workflow's OIDC identity, configured per package on
  # npmjs.com. The other apps are private and never publish.
  publish:
    name: Publish to npm
    needs: gates
    # GitHub-hosted on purpose: npm trusted publishing does not work on self-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    # Two releases pushed close together must not race `pnpm publish`'s read-then-write.
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Each package builds itself in `prepack`; this is only so a build failure reads as one.
      - run: pnpm -r --filter './packages/*' build
      - id: version
        # The four libraries release in lockstep; the dist-tag comes from that one version, so a
        # drift between them is a failed release, not a prerelease published as `latest`.
        run: |
          VERSIONS=$(node -p "['x509','tls','imap','smtp'].map(p => require('./packages/' + p + '/package.json').version).join(' ')")
          if [ "$(echo "$VERSIONS" | tr ' ' '\n' | sort -u | wc -l)" -ne 1 ]; then
            echo "library versions differ: $VERSIONS" >&2; exit 1
          fi
          VERSION=${VERSIONS%% *}
          TAG=$(echo "$VERSION" | grep -oE 'alpha|beta|rc' || true)
          echo "tag=${TAG:-latest}" >> "$GITHUB_OUTPUT"
      - run: pnpm -r --filter './packages/*' publish --tag ${{ steps.version.outputs.tag }}
      # The CLI releases on its own version. The filtered publish skips a version npm already has,
      # and the tarball is built by the package's `prepack`.
      - id: cli
        run: |
          VERSION=$(node -p "require('./apps/cli/package.json').version")
          TAG=$(echo "$VERSION" | grep -oE 'alpha|beta|rc' || true)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG:-latest}" >> "$GITHUB_OUTPUT"
      - run: pnpm -F @yozz.app/cli publish --tag ${{ steps.cli.outputs.tag }}
      # A green publish has reported a version npm did not record (docs/open-source.md), and a new
      # version can take minutes to show, so ask the registry for this exact version for a while.
      - name: Check npm has the CLI
        run: |
          for _ in $(seq 1 12); do
            [ "$(npm view "@yozz.app/cli@${{ steps.cli.outputs.version }}" version)" = "${{ steps.cli.outputs.version }}" ] && exit 0
            sleep 15
          done
          echo "npm does not have @yozz.app/cli@${{ steps.cli.outputs.version }}" >&2; exit 1
