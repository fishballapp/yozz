<!doctype html>
<!--
  Source for apps/web/public/og.png, the 1200x630 social card. Rendered, not hand-drawn, so the
  wording can change without redrawing the type. Build it with assets/build-og.sh, which explains
  its own steps; do not screenshot this file straight to og.png, because the envelope and the type
  want opposite treatment and the script is what reconciles them.

  Three layers: envelope.jpg for the envelope, the real app screenshot clipped into its opening,
  and live text on the front panel.

  envelope.png is a generated raster with the sheet keyed out to transparency, so the app shows
  through the opening and the envelope's own fold edge — antialiasing and all — lands on top of it.
  Nothing here clips to the fold. Two earlier versions did, and both failed on the same thing: the
  fold in a raster is a soft ramp several pixels deep, so a clip laid on it either kept the light
  half of the ramp, which read as a white gash along the V, or cleared it and cut into the app.

  It is built from envelope.jpg, generated by Grok 4.6 from a composition reference rendered out of
  an earlier version of this file. Regenerate the alpha with:

    magick assets/envelope.jpg \
      \( +clone -colorspace gray -level 52%,70% -negate \) \
      -alpha off -compose CopyOpacity -composite \
      -resize 1200x630! PNG32:assets/envelope.png

  The sheet sits around 78% luminance and the brightest paper edge below 50%, so the window between
  is wide; 52% is low enough to catch the whole sheet and high enough to leave the flap's lit edge
  alone, which a 38% threshold punched a hairline through.

  The envelope was drawn in SVG for a long time and the paper never arrived: grain, soft imperfect
  folded edges and a real contact shadow are what a stack of gradients and a stroked path cannot
  fake, and every attempt landed on either a visible band or a glowing wire. The model was given a
  blank grey rectangle where the sheet goes and told repeatedly to leave it blank, because the one
  thing it must not draw is the product — an image model invents plausible, garbled UI (Jason,
  2026-09-01).

  Three constraints on the type, all from how platforms crop, scale and read a card: it stays
  inside a 60px margin (the 1080x600 safe area Facebook, LinkedIn and Slack all respect), the
  smallest of it is 30px because a Slack unfurl renders this at roughly half size, and there is one
  claim on it, because a card gets read in about a second.

  Tokens are the oklch values from apps/web/src/styles/global.css, written literally because this
  file gets no stylesheet, the same rule assets/logo.svg and public/favicon.svg follow. The
  wordmark is logo.svg's geometry inlined, green on ink, which is the treatment the mark gets
  wherever it stands alone (Jason, 2026-08-26). The face is named and stacked exactly as
  DESIGN.md's type tokens name it, so this card is checkable against the same system the app is.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Geist Variable';
        src: url('../apps/web/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2')
          format('woff2-variations');
        font-weight: 100 900;
      }

      :root {
        --paper: oklch(0.945 0.008 85);
        --paper-dim: oklch(0.706 0.01 82);
        --signal: oklch(0.87 0.19 140);
      }

      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
      }

      body {
        background: #0d0c0b;
        color: var(--paper);
        font-family: 'Geist Variable', ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        overflow: hidden;
        position: relative;
      }

      /* Sits behind the envelope's opening. It only has to cover the hole; every edge of it is
         masked by envelope.png, so it is deliberately 4px oversized on all sides and its own
         corners never show. The background is offset to put the app back on the sheet's origin. */
      .letter {
        position: absolute;
        left: 200px;
        top: 78px;
        width: 800px;
        height: 330px;
        background: url('screenshot.png') 4px 4px / 792px auto no-repeat;
      }

      /* The contact shadow the envelope casts onto the sheet was painted on the placeholder in
         envelope.jpg, so keying the placeholder out took it with it. This puts it back. It needs
         no clipping of its own: envelope.png masks it to the opening. */
      .fold-shadow,
      .envelope {
        position: absolute;
        inset: 0;
      }

      .type {
        position: absolute;
        top: 403px;
        left: 0;
        width: 1200px;
      }

      .wordmark {
        width: 147px;
        display: block;
        margin: 0 auto;
      }

      h1 {
        margin: 16px 0 0;
        font-size: 62px;
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      p {
        margin: 12px 0 0;
        font-size: 30px;
        color: var(--paper-dim);
      }

      /* build-og.sh renders this file twice and composites the two. ?layer=base is everything
         under the type; ?layer=type is the type alone on transparency. */
      body[data-layer='base'] .type,
      body[data-layer='type'] .letter,
      body[data-layer='type'] .fold-shadow,
      body[data-layer='type'] .envelope {
        visibility: hidden;
      }

      body[data-layer='type'] {
        background: none;
      }
    </style>
  </head>
  <body>
    <div class="letter"></div>

    <svg class="fold-shadow" width="1200" height="630" fill="none">
      <filter id="soft" x="-5%" y="-30%" width="110%" height="160%">
        <feGaussianBlur stdDeviation="11" />
      </filter>
      <path d="M0 173L562 359Q603 373 648 358L1200 172" stroke="#000" stroke-opacity="0.8" stroke-width="26" filter="url(#soft)" />
    </svg>

    <img class="envelope" src="envelope.png" width="1200" height="630" alt="" />

    <div class="type">
      <!-- logo.svg's geometry with its padding cropped off: the oblique puts the leftmost ink at
           the Y's bottom-left corner, so the box starts there. 333.63 = the rightmost Z at y=0
           minus that corner. -->
      <svg class="wordmark" viewBox="0 0 333.63 100" role="img" aria-label="YOZZ">
        <mask id="cut">
          <rect x="-200" y="-200" width="800" height="800" fill="#fff" />
          <rect x="-200" y="46.5" width="800" height="7" fill="#000" />
        </mask>
        <g mask="url(#cut)" transform="translate(17.63 0) skewX(-10)" fill="var(--signal)" fill-rule="evenodd">
          <path d="M0 0H26L38 30L50 0H76L51 58V100H25V58Z" />
          <path transform="translate(80 0)" d="M0 0H76V100H0ZM26 26H50V74H26Z" />
          <path transform="translate(160 0)" d="M0 0H76V26L36 74H76V100H0V74L40 26H0Z" />
          <path transform="translate(240 0)" d="M0 0H76V26L36 74H76V100H0V74L40 26H0Z" />
        </g>
      </svg>
      <h1>Zero-knowledge webmail</h1>
      <p>For the email accounts you already own.</p>
    </div>
    <script>
      const layer = new URLSearchParams(location.search).get('layer');
      if (layer) document.body.dataset.layer = layer;
    </script>
  </body>
</html>
